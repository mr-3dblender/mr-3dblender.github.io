<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LOVE PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-rose: #5c1c24;
            --gold-leaf: #d1b88e;
            --parchment: #fff9f0;
        }

        body {
            background: radial-gradient(circle at center, #fff3e6 0%, #ffe4d1 50%, #d4a373 100%);
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevents scrolling during the shot */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Floating Light Particles */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Main Card Scaling */
        .portal-card {
            background: rgba(255, 249, 240, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold-leaf);
            box-shadow: 0 20px 50px rgba(92, 28, 36, 0.15);
            max-height: 90vh; /* Ensures it never exceeds screen height */
            width: 90%;
            max-width: 500px;
            padding: 2.5rem;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .script-font { font-family: 'Great Vibes', cursive; }
        .display-font { font-family: 'Playfair Display', serif; }

        input {
            border-bottom: 1px solid var(--gold-leaf);
            transition: all 0.5s ease;
        }

        input:focus {
            border-bottom: 1px solid var(--primary-rose);
            letter-spacing: 2px;
        }

        /* The decorative corners */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--gold-leaf);
            opacity: 0.4;
        }
        .tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; border-radius: 15px 0 0 0; }
        .br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; border-radius: 0 0 15px 0; }
    </style>
</head>
<body>

    <div id="sparkle-container"></div>

    <div class="portal-card">
        <div class="corner tl"></div>
        <div class="corner br"></div>

        <div class="text-center">
            <h1 class="display-font italic text-4xl text-[#5c1c24] leading-tight">
                love Portal
            </h1>
            <p class="text-[var(--gold-leaf)] uppercase text-[10px] tracking-[4px] mt-1">
                Authenticating the Soul
            </p>
        </div>

        <div class="mt-8 space-y-6">
            <div class="relative">
                <label class="script-font text-3xl text-[#5c1c24]/70 block mb-1">username:</label>
                <input type="text" class="w-full bg-transparent py-2 text-xl outline-none text-[#5c1c24]" placeholder="Thy Name" autocomplete="off">
            </div>

            <div class="relative">
                <label class="script-font text-3xl text-[#5c1c24]/70 block mb-1">password:</label>
                <input type="password" class="w-full bg-transparent py-2 text-xl outline-none text-[#5c1c24]" placeholder="••••••••">
            </div>

            <button onclick="access()" class="w-full mt-4 py-4 rounded-full bg-[#5c1c24] text-[#fff9f0] tracking-[3px] text-sm font-bold hover:bg-[#8c1c3c] transition-all duration-500 shadow-lg">
                UNLOCK HEART
            </button>
        </div>

        <div class="mt-10 text-center">
            <div class="h-[1px] w-12 bg-[var(--gold-leaf)] mx-auto mb-4 opacity-50"></div>
            <p class="italic text-lg text-[#5c1c24]/80">love is beautiful;</p>
            <p class="display-font text-xl text-[#5c1c24] mt-1 animate-pulse tracking-wide">
                love is <span class="text-rose-700">Dangeroues.</span>
            </p>
        </div>
    </div>

    <script>
        // Create soft light particles
        const container = document.getElementById('sparkle-container');
        for (let i = 0; i < 20; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.width = sparkle.style.height = Math.random() * 5 + 2 + 'px';
            sparkle.style.animationDelay = Math.random() * 10 + 's';
            sparkle.style.animationDuration = Math.random() * 5 + 5 + 's';
            container.appendChild(sparkle);
        }

        function access() {
            const btn = event.target;
            btn.innerText = "SENSING...";
            setTimeout(() => {
                alert("The Portal remains closed.\nYour heart is not yet in rhythm.");
                btn.innerText = "UNLOCK HEART";
            }, 1200);
        }
    </script>
</body>
</html>
