<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LOVE PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Great+Vibes&family=Marcellus&display=swap" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at center, #2c070a 0%, #1a0506 100%);
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Marcellus', serif;
        }

        /* 1. Unrolling Animation */
        @keyframes unroll {
            0% { height: 0; opacity: 0; }
            10% { height: 40px; opacity: 1; }
            100% { height: 85vh; max-height: 650px; opacity: 1; }
        }

        @keyframes fadeInContent {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Container for the scroll AND the handles */
        .scroll-wrapper {
            position: relative;
            width: 90%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Added vertical padding so handles don't hit the screen edge */
            padding: 40px 0; 
        }

        .scroll-body {
            position: relative;
            width: 100%;
            background: #f4e4bc; 
            background-image: 
                linear-gradient(to bottom, #d4b483 0%, transparent 15%, transparent 85%, #d4b483 100%),
                url("https://www.transparenttextures.com/patterns/p6-dark.png");
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.2), inset 0 -10px 20px rgba(0,0,0,0.2), 0 30px 60px rgba(0,0,0,0.5);
            border-left: 2px solid #8c6a3d;
            border-right: 2px solid #8c6a3d;
            z-index: 5;
            overflow: hidden;
            animation: unroll 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* 2. The Handles (Rollers) - Positioned relative to the wrapper */
        .handle {
            position: absolute;
            left: -5%;
            width: 110%;
            height: 30px;
            background: linear-gradient(to bottom, #5c1c24, #2c070a, #5c1c24);
            border: 2px solid #d1b88e;
            border-radius: 15px;
            z-index: 20; /* Keep them above everything */
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        /* Gold decorative tips for the handles */
        .handle::before, .handle::after {
            content: '';
            position: absolute;
            top: -2px;
            width: 15px;
            height: 30px;
            background: #d1b88e;
            border-radius: 5px;
        }
        .handle::before { left: -5px; }
        .handle::after { right: -5px; }

        .handle-top { top: 25px; }
        .handle-bottom { bottom: 25px; }

        .content-wrapper {
            opacity: 0;
            animation: fadeInContent 1s ease-out forwards;
            animation-delay: 2.2s;
            padding: 4rem 3rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Floating Emojis */
        @keyframes drift {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translate(20px, -40px) rotate(15deg); opacity: 0; }
        }
        .emoji {
            position: absolute;
            animation: drift 7s infinite ease-in-out;
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }

        /* Loading Overlay */
        #loading-state {
            display: none;
            position: absolute;
            inset: 0;
            background: #f4e4bc;
            background-image: linear-gradient(to bottom, #d4b483 0%, transparent 15%, transparent 85%, #d4b483 100%);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .heart-beat {
            font-size: 5rem;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.4); }
        }

        .heading-style { font-family: 'Cinzel Decorative', serif; }
        .script-style { font-family: 'Great Vibes', cursive; }

        input {
            border-bottom: 1.5px solid #5c1c24;
            text-transform: uppercase;
            letter-spacing: 2px;
            width: 100%;
            background: transparent;
            padding: 10px 0;
            outline: none;
            color: #2c070a;
        }
        
        input::placeholder { color: rgba(92, 28, 36, 0.4); }
    </style>
</head>
<body>

    <div class="emoji text-4xl" style="top: 15%; left: 5%; animation-delay: 2s;">💖</div>
    <div class="emoji text-5xl" style="top: 60%; right: 5%; animation-delay: 4s;">🌹</div>
    <div class="emoji text-3xl" style="bottom: 15%; left: 10%; animation-delay: 6s;">💘</div>
    <div class="emoji text-4xl" style="top: 10%; right: 10%; animation-delay: 3s;">✨</div>

    <div class="scroll-wrapper">
        <div class="handle handle-top"></div>

        <div class="scroll-body">
            <div id="loading-state">
                <div class="heart-beat">❤️</div>
                <h2 class="heading-style text-2xl mt-8 tracking-[0.4em] text-[#5c1c24]">LOADING</h2>
                <p class="script-style text-2xl mt-2 text-[#8c6a3d]">Consulting the stars...</p>
            </div>

            <div class="content-wrapper">
                <div class="text-center mb-10">
                    <h1 class="heading-style text-3xl font-bold text-[#5c1c24] tracking-tighter">LOVE PORTAL</h1>
                    <div class="h-px w-32 bg-[#5c1c24]/30 mx-auto mt-2"></div>
                </div>

                <div class="space-y-10">
                    <div>
                        <label class="block text-[10px] font-bold tracking-[5px] text-[#5c1c24] mb-1">USERNAME</label>
                        <input type="text" placeholder="WHO SEEKS ENTRY?" autocomplete="off">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold tracking-[5px] text-[#5c1c24] mb-1">PASSWORD</label>
                        <input type="password" placeholder="THE SACRED WORD">
                    </div>

                    <button onclick="ignitePortal()" class="w-full py-5 bg-[#5c1c24] text-[#f4e4bc] heading-style tracking-[4px] text-xs font-bold hover:bg-[#2c070a] transition-all duration-700 shadow-2xl">
                        UNLOCK HEARTS
                    </button>
                </div>

                <div class="mt-14 text-center border-t border-[#5c1c24]/10 pt-8">
                    <p class="italic text-xl text-[#5c1c24]/80 script-style">love is beautiful;</p>
                    <p class="heading-style text-lg text-[#5c1c24] mt-2 font-bold tracking-widest uppercase">
                        LOVE IS <span class="text-red-700">DANGEROUES.</span>
                    </p>
                </div>
            </div>
        </div>

        <div class="handle handle-bottom"></div>
    </div>

    <script>
        function ignitePortal() {
            document.getElementById('loading-state').style.display = 'flex';
        }
    </script>
</body>
</html>
